<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html><head><meta charset="utf8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--font-body);background:#fff;color:var(--fg-1);padding:22px}
.row{display:flex;gap:14px}
.sw{flex:1;border-radius:var(--r-md);border:1px solid var(--border);overflow:hidden}
.chip{height:74px}
.meta{padding:10px 12px}
.name{font-weight:600;font-size:13px}
.hex{font-family:var(--font-mono);font-size:11px;color:var(--fg-2);margin-top:2px}
</style></head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:#101820"></div><div class="meta"><div class="name">Ink</div><div class="hex">#101820</div></div></div>
  <div class="sw"><div class="chip" style="background:#1A2530"></div><div class="meta"><div class="name">Ink 2</div><div class="hex">#1A2530</div></div></div>
  <div class="sw"><div class="chip" style="background:#243140"></div><div class="meta"><div class="name">Ink 3</div><div class="hex">#243140</div></div></div>
  <div class="sw"><div class="chip" style="background:#6C5CE7"></div><div class="meta"><div class="name">Indigo · accent</div><div class="hex">#6C5CE7</div></div></div>
  <div class="sw"><div class="chip" style="background:#fff;border-bottom:1px solid var(--border)"></div><div class="meta"><div class="name">White</div><div class="hex">#FFFFFF</div></div></div>
</div>
</body></html>
