<!DOCTYPE html><html><head><meta charset="utf8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--font-body);background:#fff;color:var(--fg-1);padding:22px}
.wash{height:84px;border-radius:var(--r-lg);background:var(--brand-gradient-3);position:relative;overflow:hidden;margin-bottom:14px}
.dia{position:absolute;border-radius:4px;transform:rotate(45deg);opacity:.5}
.row{display:flex;gap:14px}
.tile{flex:1;border-radius:var(--r-md);border:1px solid var(--border);padding:12px 14px}
.tile .n{font-weight:600;font-size:13px}
.tile .d{color:var(--fg-2);font-size:11.5px;line-height:1.45;margin-top:3px}
</style></head>
<body>
<div class="wash">
  <div class="dia" style="width:26px;height:26px;background:#fff;top:14px;left:60px"></div>
  <div class="dia" style="width:16px;height:16px;background:#fff;top:50px;left:160px;opacity:.4"></div>
  <div class="dia" style="width:34px;height:34px;background:#fff;top:24px;right:40px;opacity:.35"></div>
</div>
<div class="row">
  <div class="tile"><div class="n">Isometric 3D</div><div class="d">Light, airy vector scenes at a 2:1 iso angle.</div></div>
  <div class="tile"><div class="n">Gradient fills</div><div class="d">Violet → indigo → blue, soft pink accents.</div></div>
  <div class="tile"><div class="n">Floating confetti</div><div class="d">Diamonds & plus-signs, soft shadows.</div></div>
</div>
</body></html>
