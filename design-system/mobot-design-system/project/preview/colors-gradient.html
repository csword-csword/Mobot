<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html><head><meta charset="utf8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--font-body);background:#fff;color:var(--fg-1);padding:22px}
.big{height:88px;border-radius:var(--r-lg);background:var(--brand-gradient-3)}
.row{display:flex;gap:14px;margin-top:14px}
.sw{flex:1}
.chip{height:48px;border-radius:var(--r-sm);border:1px solid rgba(0,0,0,.05)}
.name{font-weight:600;font-size:12px;margin-top:7px}
.hex{font-family:var(--font-mono);font-size:11px;color:var(--fg-2)}
</style></head>
<body>
<div class="big"></div>
<div class="row">
  <div class="sw"><div class="chip" style="background:#E79BD4"></div><div class="name">Pink</div><div class="hex">#E79BD4</div></div>
  <div class="sw"><div class="chip" style="background:#8B7BE8"></div><div class="name">Violet</div><div class="hex">#8B7BE8</div></div>
  <div class="sw"><div class="chip" style="background:#6C5CE7"></div><div class="name">Indigo</div><div class="hex">#6C5CE7</div></div>
  <div class="sw"><div class="chip" style="background:#5B9DF0"></div><div class="name">Blue</div><div class="hex">#5B9DF0</div></div>
  <div class="sw"><div class="chip" style="background:#86BFF2"></div><div class="name">Blue bright</div><div class="hex">#86BFF2</div></div>
</div>
</body></html>
