<!-- @dsCard group="Spacing" -->
<!DOCTYPE html><html><head><meta charset="utf8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--font-body);background:#fff;color:var(--fg-1);padding:24px}
.row{display:flex;align-items:flex-end;gap:16px}
.cell{text-align:center}
.box{background:var(--brand-gradient);border-radius:6px}
.n{font-weight:600;font-size:12px;margin-top:8px}
.v{font-family:var(--font-mono);font-size:10px;color:var(--fg-2)}
</style></head>
<body>
<div class="row" id="r"></div>
<script>
const s=[['1',4],['2',8],['3',12],['4',16],['5',20],['6',24],['8',32],['10',40],['12',48],['16',64]];
document.getElementById('r').innerHTML=s.map(([k,v])=>`<div class="cell"><div class="box" style="width:${v}px;height:${v}px"></div><div class="n">${k}</div><div class="v">${v}px</div></div>`).join('');
</script>
</body></html>
