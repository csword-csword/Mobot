<!DOCTYPE html><html><head><meta charset="utf8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--font-body);background:#fff;color:var(--fg-1);padding:24px;display:flex;align-items:center;gap:26px}
.mark{display:flex;align-items:center;gap:22px}
.disc{width:96px;height:96px;border-radius:50%;background:var(--mobot-ink);display:flex;align-items:center;justify-content:center;flex:none}
.disc img{width:64px}
.lt{width:96px;height:96px;border-radius:50%;background:var(--gray-50);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex:none}
.lt img{width:64px}
.txt h4{margin:0 0 6px;font-family:var(--font-display);font-weight:600;font-size:18px}
.txt p{margin:0;color:var(--fg-2);font-size:13px;line-height:1.5;max-width:300px}
</style></head>
<body>
<div class="mark">
  <div class="disc"><img src="../assets/mobot-icon-white.png"></div>
  <div class="lt"><img src="../assets/mobot-icon-navy.png"></div>
</div>
<div class="txt">
  <h4>The robot mark</h4>
  <p>Round head, three antennae, two broadcast waves, two eyes. Use as app icon / favicon / avatar. Always monochrome — white on ink, ink on light. Keep clearspace ≥ 25% of diameter.</p>
</div>
</body></html>
