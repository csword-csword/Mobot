<!-- @dsCard group="Spacing" -->
<!DOCTYPE html><html><head><meta charset="utf8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--font-body);background:var(--gray-50);color:var(--fg-1);padding:30px}
.row{display:flex;gap:22px}
.cell{flex:1;text-align:center}
.box{height:76px;background:#fff;border-radius:var(--r-md)}
.n{font-weight:600;font-size:12px;margin-top:12px}
.v{font-family:var(--font-mono);font-size:9px;color:var(--fg-2)}
</style></head>
<body>
<div class="row">
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-xs)"></div><div class="n">xs</div></div>
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="n">sm</div></div>
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="n">md</div></div>
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="n">lg</div></div>
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-brand)"></div><div class="n">brand</div><div class="v">indigo glow</div></div>
</div>
</body></html>
