<!DOCTYPE html><html><head><meta charset="utf8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--font-body);background:#fff;color:var(--fg-1);padding:22px}
.line{display:flex;align-items:baseline;gap:14px;padding:5px 0}
.tag{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);width:118px;flex:none}
.s{font-family:var(--font-display);font-weight:600;color:var(--fg-1);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head>
<body>
<div class="line"><span class="tag">6xl · 76</span><span class="s" style="font-size:46px">Mobot</span></div>
<div class="line"><span class="tag">4xl · 48</span><span class="s" style="font-size:40px">Mobot</span></div>
<div class="line"><span class="tag">2xl · 30</span><span class="s" style="font-size:30px">Mobot robots</span></div>
<div class="line"><span class="tag">lg · 20</span><span class="s" style="font-size:20px">Mobot robots test</span></div>
<div class="line"><span class="tag">base · 16</span><span class="s" style="font-size:16px;font-weight:400">Mobot robots test real devices</span></div>
<div class="line"><span class="tag">sm · 14</span><span class="s" style="font-size:14px;font-weight:400">Mobot robots test real devices</span></div>
<div class="line"><span class="tag">xs · 12</span><span class="s" style="font-size:12px;font-weight:400">Mobot robots test real devices, the way humans do</span></div>
</body></html>
