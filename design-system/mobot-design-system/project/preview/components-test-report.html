<!-- @dsCard group="Components" -->
<!DOCTYPE html><html><head><meta charset="utf8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--font-body);background:var(--gray-50);color:var(--fg-1);padding:20px}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);overflow:hidden}
.head{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--gray-100)}
.head .nm{font-weight:600;font-size:14px}
.head .dev{font-family:var(--font-mono);font-size:11px;color:var(--fg-2);margin-left:auto}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:var(--r-pill);background:var(--pass-bg);color:#13935f}
.lucide{width:13px;height:13px}
.body{display:flex;gap:14px;padding:16px}
.shot{flex:1}
.shot .cap{font-size:11px;color:var(--fg-3);margin-bottom:6px;font-family:var(--font-mono)}
.scr{aspect-ratio:9/16;height:120px;border-radius:10px;border:1px solid var(--gray-200);background:linear-gradient(160deg,#EDE9FB,#E6F0FD);margin:0 auto}
.note{flex:1.4;font-size:13px;color:var(--fg-2);line-height:1.5}
.note b{color:var(--fg-1)}
</style></head>
<body>
<div class="card">
  <div class="head">
    <span class="badge"><i data-lucide="check" class="lucide"></i>Passed</span>
    <span class="nm">Checkout → Apple Pay</span>
    <span class="dev">iPhone 15 Pro · iOS 17.4</span>
  </div>
  <div class="body">
    <div class="shot"><div class="cap">BASELINE</div><div class="scr"></div></div>
    <div class="shot"><div class="cap">RESULT</div><div class="scr"></div></div>
    <div class="note"><b>CSM note.</b> Robot completed 14 actions, tap→swipe→biometric. Apple Pay sheet rendered correctly; no visual diff vs baseline. Network + device logs attached.</div>
  </div>
</div>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body></html>
