<!-- @dsCard group="Components" -->
<!DOCTYPE html><html><head><meta charset="utf8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--font-body);background:#fff;color:var(--fg-1);padding:24px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.btn{font-family:var(--font-body);font-weight:600;font-size:15px;border:0;cursor:pointer;border-radius:var(--r-md);padding:12px 20px;display:inline-flex;align-items:center;gap:8px;transition:.2s}
.primary{background:var(--brand-indigo);color:#fff}
.primary:hover{background:#5a4bd4;transform:translateY(-1px);box-shadow:var(--shadow-brand)}
.grad{background:var(--brand-gradient);color:#fff}
.ghost{background:transparent;color:var(--fg-1);border:1.5px solid var(--gray-200)}
.ghost:hover{border-color:var(--gray-400)}
.dark{background:var(--mobot-ink);color:#fff}
.pill{border-radius:var(--r-pill);background:var(--gray-100);color:var(--fg-1);font-weight:500;padding:8px 16px}
.pill.on{background:var(--mobot-ink);color:#fff}
.lbl{font-family:var(--font-mono);font-size:10px;color:var(--fg-3)}
.lucide{width:17px;height:17px}
</style></head>
<body>
<span class="lbl">BUTTONS</span>
<div class="row">
  <button class="btn primary">Schedule a Demo <i data-lucide="arrow-right" class="lucide"></i></button>
  <button class="btn grad">Try Mobot <i data-lucide="arrow-right" class="lucide"></i></button>
  <button class="btn dark">Login</button>
  <button class="btn ghost">Read Case Study</button>
</div>
<span class="lbl">PILLS / TABS</span>
<div class="row">
  <span class="pill on">No</span><span class="pill">Some</span><span class="pill">Mostly</span><span class="pill">Full automation</span>
</div>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body></html>
